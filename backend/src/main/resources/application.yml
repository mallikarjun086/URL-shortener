spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  application:
    name: url-shortener-backend

  main:
    banner-mode: off # Disable noisy Spring ASCII banner

logging:
  level:
    root: WARN # Suppress verbose framework logs
    com.urlshortener: INFO # Show clean application logs
    org.springframework.web: WARN

server:
  port: 8081 # Using 8081 to avoid conflict with busy port 8080

app:
  jwt:
    secret: dGhpc0lzQVNlY3JldEtleUZvckpXVENyZWF0aW9uQW5kVmFsaWRhdGlvbkluT3VyVVJMU2hvcnRlbmVyQXBwbGljYXRpb24xMjM0NTY3ODkw
    expiration-ms: 86400000 # 24 Hours
  domain: ${APP_DOMAIN:http://localhost:8081}
  snowflake:
    worker-id: ${WORKER_ID:1}
    datacenter-id: ${DATACENTER_ID:1}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  metrics:
    export:
      prometheus:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
